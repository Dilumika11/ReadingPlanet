# Automated tests only: throwaway in-memory H2 (MySQL mode), schema built
# from the entities. The application itself always runs on MySQL + Flyway.
spring.datasource.url=jdbc:h2:mem:epms-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
epms.uploads.dir=${java.io.tmpdir}/epms-test-uploads
epms.receipts.dir=${java.io.tmpdir}/epms-test-receipts
