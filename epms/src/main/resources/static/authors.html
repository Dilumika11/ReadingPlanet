<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/rethink-sans.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Authors – Reading Planet</title>
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/authors.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div id="header-container"></div>

<section class="auth-page-title">
    <div class="auth-page-title-inner">
        <h1>All Authors</h1>
        <p class="auth-breadcrumb">
            <a href="/">Home</a>
            <span>/</span>
            <span>All Authors</span>
        </p>
    </div>
</section>

<main class="authors-page">
    <div class="authors-container">
        <div class="authors-search-wrap">
            <input type="search" id="authorSearch" placeholder="Search authors..." autocomplete="off">
        </div>

        <div id="authorGrid" class="authors-grid">
            <div class="authors-empty">Loading authors...</div>
        </div>

        <p id="authorsEmpty" class="authors-empty" hidden>No authors found.</p>
    </div>
</main>

<div id="footer-container"></div>
<script src="/js/header.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/load-components.js"></script>
<script src="/js/authors.js"></script>
</body>
</html>
