<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/rethink-sans.css">
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Reading Planet</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8fc;
            display: flex;
            flex-direction: column;
        }

        /* =====================================================
           HEADER
           ===================================================== */

        .rp-header {
            background: #173b68;
            height: 72px;
            display: flex;
            align-items: center;
            padding: 0 7%;
            color: white;
        }

        .rp-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 700;
        }

        .rp-logo i {
            font-size: 27px;
        }


        /* =====================================================
           MAIN
           ===================================================== */

        .page-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 470px;
            background: white;
            border-radius: 18px;
            padding: 42px;
            box-shadow: 0 12px 35px rgba(23, 59, 104, 0.12);
        }


        .reset-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #e8f2fc;
            color: #173b68;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            font-size: 30px;
        }


        .reset-card h1 {
            text-align: center;
            color: #173b68;
            font-size: 28px;
            margin-bottom: 10px;
        }


        .reset-description {
            text-align: center;
            color: #687789;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 14px;
        }


        /* =====================================================
           FORM
           ===================================================== */

        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #26384d;
            font-size: 14px;
            font-weight: 600;
        }


        .input-wrapper {
            position: relative;
        }


        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8a98a8;
        }


        .input-wrapper input {
            width: 100%;
            height: 48px;
            border: 1px solid #d5dee8;
            border-radius: 9px;
            padding: 0 45px 0 45px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }


        .input-wrapper input:focus {
            border-color: #4c8ed9;
            box-shadow: 0 0 0 3px rgba(76, 142, 217, 0.12);
        }


        .toggle-password {
            position: absolute;
            right: 15px;
            left: auto !important;
            cursor: pointer;
            color: #7b8794 !important;
        }


        /* =====================================================
           PASSWORD REQUIREMENTS
           ===================================================== */

        .password-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #788696;
        }


        /* =====================================================
           BUTTON
           ===================================================== */

        .reset-button {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 9px;
            background: #173b68;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }


        .reset-button:hover {
            background: #102d50;
        }


        .reset-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }


        /* =====================================================
           MESSAGE
           ===================================================== */

        .message {
            display: none;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.5;
        }


        .message.success {
            display: block;
            background: #e9f8ef;
            color: #19713b;
            border: 1px solid #b9e7c9;
        }


        .message.error {
            display: block;
            background: #fff0f0;
            color: #b42318;
            border: 1px solid #f2b8b5;
        }


        /* =====================================================
           BACK TO LOGIN
           ===================================================== */

        .back-login {
            text-align: center;
            margin-top: 24px;
        }


        .back-login a {
            color: #315f91;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }


        .back-login a:hover {
            text-decoration: underline;
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .rp-footer {
            background: #173b68;
            color: #dbe7f4;
            text-align: center;
            padding: 18px;
            font-size: 12px;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            .rp-header {
                padding: 0 20px;
            }

            .reset-card {
                padding: 30px 22px;
            }

            .reset-card h1 {
                font-size: 24px;
            }

        }

    </style>
</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="rp-header">

    <div class="rp-logo">
        <i class="fas fa-book-open"></i>
        <span>Reading Planet</span>
    </div>

</header>



<!-- =====================================================
     MAIN
     ===================================================== -->

<main class="page-wrapper">

    <div class="reset-card">


        <div class="reset-icon">
            <i class="fas fa-lock"></i>
        </div>


        <h1>Reset Your Password</h1>


        <p class="reset-description">
            Create a new password for your Reading Planet
            account.
        </p>



        <!-- =================================================
             MESSAGE
             ================================================= -->

        <div id="message"
             class="message">
        </div>



        <!-- =================================================
             FORM
             ================================================= -->

        <form id="resetPasswordForm">


            <!-- New Password -->

            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <div class="input-wrapper">

                    <i class="fas fa-lock"></i>

                    <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Enter your new password"
                            minlength="8"
                            maxlength="100"
                            required
                    >

                    <i class="fas fa-eye toggle-password"
                       id="toggleNewPassword">
                    </i>

                </div>

                <div class="password-hint">
                    Password must contain at least 8 characters.
                </div>

            </div>



            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <div class="input-wrapper">

                    <i class="fas fa-lock"></i>

                    <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your new password"
                            minlength="8"
                            maxlength="100"
                            required
                    >

                    <i class="fas fa-eye toggle-password"
                       id="toggleConfirmPassword">
                    </i>

                </div>

            </div>



            <!-- Reset Button -->

            <button
                    type="submit"
                    class="reset-button"
                    id="resetButton">

                <i class="fas fa-key"></i>
                Reset Password

            </button>


        </form>



        <!-- =================================================
             BACK TO LOGIN
             ================================================= -->

        <div class="back-login">

            <a href="/author-login.html">
                <i class="fas fa-arrow-left"></i>
                Back to Author Login
            </a>

        </div>


    </div>

</main>



<!-- =====================================================
     FOOTER
     ===================================================== -->

<footer class="rp-footer">

    © 2026 Reading Planet. All rights reserved.

</footer>



<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script src="/js/author-api.js"></script>
<script>

    /* =====================================================
       GET TOKEN FROM URL
       ===================================================== */

    const urlParams =
        new URLSearchParams(
            window.location.search
        );

    const resetToken =
        urlParams.get("token");


    const form =
        document.getElementById(
            "resetPasswordForm"
        );

    const newPassword =
        document.getElementById(
            "newPassword"
        );

    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        );

    const resetButton =
        document.getElementById(
            "resetButton"
        );

    const message =
        document.getElementById(
            "message"
        );



    /* =====================================================
       SHOW MESSAGE
       ===================================================== */

    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            "message " + type;

    }



    /* =====================================================
       CHECK TOKEN
       ===================================================== */

    if (!resetToken) {

        showMessage(
            "Invalid password reset link. Please request a new password reset link.",
            "error"
        );

        resetButton.disabled =
            true;

    }



    /* =====================================================
       TOGGLE NEW PASSWORD
       ===================================================== */

    document.getElementById(
        "toggleNewPassword"
    ).addEventListener(
        "click",
        function () {

            if (
                newPassword.type ===
                "password"
            ) {

                newPassword.type =
                    "text";

                this.classList.remove(
                    "fa-eye"
                );

                this.classList.add(
                    "fa-eye-slash"
                );

            } else {

                newPassword.type =
                    "password";

                this.classList.remove(
                    "fa-eye-slash"
                );

                this.classList.add(
                    "fa-eye"
                );

            }

        }
    );



    /* =====================================================
       TOGGLE CONFIRM PASSWORD
       ===================================================== */

    document.getElementById(
        "toggleConfirmPassword"
    ).addEventListener(
        "click",
        function () {

            if (
                confirmPassword.type ===
                "password"
            ) {

                confirmPassword.type =
                    "text";

                this.classList.remove(
                    "fa-eye"
                );

                this.classList.add(
                    "fa-eye-slash"
                );

            } else {

                confirmPassword.type =
                    "password";

                this.classList.remove(
                    "fa-eye-slash"
                );

                this.classList.add(
                    "fa-eye"
                );

            }

        }
    );



    /* =====================================================
       SUBMIT RESET PASSWORD
       ===================================================== */

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            if (!resetToken) {

                return;

            }


            const password =
                newPassword.value;

            const confirm =
                confirmPassword.value;



            /* ---------------------------------------------
               Check password length
               --------------------------------------------- */

            if (password.length < 8) {

                showMessage(
                    "Password must contain at least 8 characters.",
                    "error"
                );

                return;

            }



            /* ---------------------------------------------
               Check password match
               --------------------------------------------- */

            if (password !== confirm) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;

            }



            try {

                resetButton.disabled =
                    true;

                resetButton.innerHTML =
                    '<i class="fas fa-spinner fa-spin"></i> Resetting...';



                const response =
                    await fetch(
                        "/api/auth/reset-password",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    token:
                                    resetToken,

                                    newPassword:
                                    password,

                                    confirmPassword:
                                    confirm

                                })

                        }
                    );



                const result =
                    await response.json();



                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Unable to reset password."
                    );

                }



                if (!result.success) {

                    throw new Error(
                        result.message ||
                        "Unable to reset password."
                    );

                }



                /* -----------------------------------------
                   Success
                   ----------------------------------------- */

                showMessage(
                    "Password reset successfully. Redirecting to login...",
                    "success"
                );


                form.reset();


                setTimeout(
                    function () {

                        window.location.href =
                            "/author-login.html";

                    },
                    2000
                );


            } catch (error) {

                console.error(
                    "Password reset error:",
                    error
                );


                showMessage(
                    error.message ||
                    "Unable to reset password. Please try again.",
                    "error"
                );


                resetButton.disabled =
                    false;

                resetButton.innerHTML =
                    '<i class="fas fa-key"></i> Reset Password';

            }

        }
    );

</script>


</body>

</html>
