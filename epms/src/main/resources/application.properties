# =========================
# Application
# =========================
spring.application.name=epms

# Always uses the real MySQL "epms" database on localhost (see below).

# =========================
# Server
# =========================
server.port=8080

# =========================
# Database
# =========================
# Credentials can be overridden without editing this file, e.g.
#   DB_URL=... DB_USERNAME=... DB_PASSWORD=... bash mvnw spring-boot:run
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/epms?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

# =========================
# Flyway
# =========================
# The base schema comes from docs/epms-schema.sql. Flyway then applies each
# epic's own changes on top (Epic 4 owns versions V400-V499). On a database
# that was created before Flyway was added, the first run records a baseline
# and then applies the pending migrations.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Logging
# =========================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# =========================
# Uploads (book covers) — stored on disk, served at /uploads/**
# Fixed location under the user's home so IntelliJ, Maven and tests all
# read/write the same folder regardless of working directory.
# =========================
epms.uploads.dir=${user.home}/.readingplanet/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# =========================
# JWT
# =========================
jwt.secret=ThisIsASecretKeyForEPMSProject2026ChangeInProduction
jwt.expiration=86400000