# =========================
# Dev profile: file-based H2 under ~/.readingplanet, no external DB needed.
# Data (users, books, uploaded covers, agreements) survives restarts; delete
# ~/.readingplanet/epms-dev.mv.db to start fresh. AUTO_SERVER lets a second
# process (e.g. the H2 console or tests) open it while the app is running.
# =========================

spring.datasource.url=jdbc:h2:file:${user.home}/.readingplanet/epms-dev;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Seed dummy Epic 3 sales data + demo royalty agreements on startup
# (see config/DemoSalesDataInitializer). Dev/demo only.
epms.demo-data.enabled=true
