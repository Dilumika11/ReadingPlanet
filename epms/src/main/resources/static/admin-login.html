<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login – Reading Planet EPMS</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="admin-login-body">

<main class="admin-login-main">
    <div class="admin-login-card">
        <div class="admin-login-brand">
            <i class="fas fa-book-open"></i>
            <h1>Reading Planet</h1>
            <p>Staff &amp; Admin Portal</p>
        </div>

        <div id="login-message" class="auth-message" hidden></div>

        <form id="staffLoginForm" novalidate>
            <div class="auth-field">
                <label for="loginEmail">Email</label>
                <input type="email"
                       id="loginEmail"
                       name="email"
                       placeholder="Enter your staff email"
                       autocomplete="username"
                       required>
            </div>

            <div class="auth-field">
                <label for="loginPassword">Password</label>
                <div class="password-wrapper">
                    <input type="password"
                           id="loginPassword"
                           name="password"
                           placeholder="Enter your password"
                           autocomplete="current-password"
                           required>
                    <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Show password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="auth-btn auth-btn-primary">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <p class="admin-login-note">
            This portal is for authorised staff only.<br>
            <a href="/">← Back to public website</a>
        </p>
    </div>
</main>

<script src="/js/admin-auth.js"></script>
</body>
</html>
