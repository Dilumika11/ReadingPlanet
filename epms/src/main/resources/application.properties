# =========================
# Application
# =========================
spring.application.name=epms

# When no profile is chosen (e.g. plain "Run" in IntelliJ), fall back to the
# dev profile: in-memory H2 + seeded dummy Epic 3 sales data, no MySQL needed.
# To use MySQL instead, run with -Dspring.profiles.active=default
spring.profiles.default=dev

# =========================
# Server
# =========================
server.port=8080

# =========================
# Database
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/epms?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=ASDfg56123##

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Logging
# =========================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# =========================
# Uploads (book covers) — stored on disk, served at /uploads/**
# Fixed location under the user's home so IntelliJ, Maven and tests all
# read/write the same folder regardless of working directory.
# =========================
epms.uploads.dir=${user.home}/.readingplanet/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# =========================
# JWT
# =========================
jwt.secret=ThisIsASecretKeyForEPMSProject2026ChangeInProduction
jwt.expiration=86400000